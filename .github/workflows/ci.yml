name: CI

on:
  # Semua base branch: PR di repo ini bisa bertumpuk (branch tahap di atas branch tahap lain).
  pull_request:
  push:
    branches: [main]

# Satu run aktif per ref; push baru membatalkan run lama di PR/branch yang sama.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend + shared (typecheck, lint, format, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ornament
          POSTGRES_PASSWORD: ornament
          POSTGRES_DB: ornament_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ornament -d ornament_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s

    env:
      # Helper tes hanya membaca TEST_DATABASE_URL (bukan DATABASE_URL) dan menolak
      # nama database yang tidak berakhiran `_test`.
      TEST_DATABASE_URL: postgresql://ornament:ornament@localhost:5432/ornament_test?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Eksplisit: jangan bergantung pada lifecycle script saat `npm ci`.
      - name: Generate Prisma Client
        run: npm run db:generate --workspace backend

      # Backend (typecheck, lint, build) membaca tipe `@ornament/shared` dari `dist/`.
      - name: Build shared
        run: npm run build:shared

      - name: Typecheck
        run: npm run typecheck --workspace packages/shared --workspace backend

      # Job ini hanya shared + backend; lint frontend dijalankan di job `frontend`.
      - name: Lint
        run: npm run lint --workspace packages/shared --workspace backend

      - name: Format check
        run: npm run format:check

      # Shared (skema) lalu backend (unit + integration).
      - name: Test
        run: npm test

      - name: Build
        run: npm run build --workspace backend

  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Next (`transpilePackages`) dan tsc frontend memakai `dist/` `@ornament/shared`.
      - name: Build shared
        run: npm run build:shared

      - name: Typecheck
        run: npm run typecheck --workspace frontend

      # `next lint` dihapus di Next 16; ESLint dipanggil langsung lewat
      # frontend/eslint.config.js.
      - name: Lint
        run: npm run lint --workspace frontend

      - name: Build
        run: npm run build --workspace frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
